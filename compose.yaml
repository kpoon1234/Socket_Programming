name: socket-chat

services:
  server:
    build: .
    image: socket-chat:local
    command: ["python", "-u", "server.py"]
    environment:
      CHAT_STATE_PATH: /data/chat_state.json
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
    volumes:
      - chat-data:/data
    networks:
      - chat
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',5000),timeout=2).close()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build: .
    image: socket-chat:local
    command: ["python", "-u", "web_bridge.py", "--host", "0.0.0.0", "--tcp-host", "server"]
    environment:
      CHAT_PUBLIC_ORIGIN: ${CHAT_PUBLIC_ORIGIN:-}
    ports:
      - "127.0.0.1:${CHAT_WEB_PORT:-3000}:3000"
    networks:
      - chat
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/config',timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  chat:

volumes:
  chat-data:
